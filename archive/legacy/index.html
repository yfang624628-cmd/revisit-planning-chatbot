<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>行程规划助手</title>
<style>
:root{
  --bg:#E7EAEA; --surface:#FCFCFB; --surface-2:#F2F4F4;
  --line:#D0D5D6; --line-2:#E0E4E4;
  --ink:#14181A; --ink-2:#3C4448; --dim:#687277; --faint:#8E979B;
  --accent:#0B6157; --accent-2:#0E7A6D; --accent-soft:#DDEBE8;
  --warn:#94501A; --warn-soft:#F4E9DE;
  --stop:#7E3030; --stop-soft:#F2E5E5;
  --hatch-a:#C3C9CB; --hatch-b:#D6DBDC; --slack:#E9ECEC;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
  font-size:14px;line-height:1.6;padding:32px 20px 72px}
.wrap{max-width:1000px;margin:0 auto}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;letter-spacing:-.01em}

/* ---------- masthead ---------- */
.masthead{border-bottom:2px solid var(--ink);padding-bottom:18px;margin-bottom:26px}
.kicker{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
h1{font-size:27px;line-height:1.25;margin:10px 0 8px;letter-spacing:-.01em;font-weight:650}
.claim{color:var(--ink-2);max-width:64ch;margin:0}
.claim b{font-weight:650;color:var(--ink);box-shadow:inset 0 -8px 0 var(--accent-soft)}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.tabs button{font-family:var(--sans);font-size:13.5px;padding:10px 16px;border-radius:3px;cursor:pointer;
  background:var(--surface);border:1px solid var(--line);color:var(--ink-2);text-align:left;line-height:1.4}
.tabs button .sub{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;
  color:var(--faint);margin-top:2px}
.tabs button[aria-current=true]{background:var(--ink);border-color:var(--ink);color:var(--surface);font-weight:600}
.tabs button[aria-current=true] .sub{color:#9BA6A4}
.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- panels ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:4px;margin-bottom:16px}
.pad{padding:18px}
.divider{height:1px;background:var(--line-2)}
.sec-h{font-size:11px;color:var(--dim);letter-spacing:.06em;margin-bottom:11px}

/* ---------- 收窄：第一句 ---------- */
.ask{background:var(--surface-2);border-left:2px solid var(--ink);padding:11px 14px;
  font-size:13.5px;color:var(--ink-2);margin:0 0 14px;border-radius:0 3px 3px 0}
.ask b{color:var(--ink);font-weight:600}
.narrow-q{font-size:17px;font-weight:600;line-height:1.5;margin:0 0 4px;letter-spacing:-.01em}
.narrow-q b{box-shadow:inset 0 -9px 0 var(--accent-soft)}
.narrow-why{font-size:12.5px;color:var(--dim);margin:0 0 13px}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opt{font-family:var(--sans);font-size:13.5px;padding:9px 15px;border-radius:3px;cursor:pointer;
  background:var(--surface);border:1.5px solid var(--accent);color:var(--accent);font-weight:600;line-height:1.35}
.opt .op-sub{display:block;font-family:var(--mono);font-size:10.5px;font-weight:400;opacity:.72;margin-top:2px}
.opt:hover{background:var(--accent-soft)}
.opt[aria-pressed=true]{background:var(--accent);color:#F4F9F8;border-color:var(--accent)}
.opt:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* ---------- slider ---------- */
.ctl{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.ctl-label{font-size:12px;color:var(--dim);letter-spacing:.04em;flex:0 0 auto}
.readout .cur{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:30px;
  font-weight:600;letter-spacing:-.02em;display:inline-block;text-align:left}
#budgetOutA{min-width:6.6ch}
#budgetOutB{min-width:5.4ch}
.slider-line{flex:1 1 320px;min-width:200px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;background:transparent;margin:0;display:block}
input[type=range]:focus{outline:none}
input[type=range]:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 3px var(--accent-soft)}
input[type=range]:focus-visible::-moz-range-thumb{box-shadow:0 0 0 3px var(--accent-soft)}
input[type=range]::-webkit-slider-runnable-track{height:4px;background:var(--line);border-radius:2px}
input[type=range]::-moz-range-track{height:4px;background:var(--line);border-radius:2px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;height:22px;width:12px;border-radius:2px;
  background:var(--ink);border:none;margin-top:-9px;cursor:grab}
input[type=range]::-moz-range-thumb{height:22px;width:12px;border-radius:2px;background:var(--ink);border:none;cursor:grab}
input[type=range]:active::-webkit-slider-thumb{cursor:grabbing;background:var(--accent)}
input[type=range]:active::-moz-range-thumb{cursor:grabbing;background:var(--accent)}
.scale{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--faint);margin-top:6px}

/* ---------- status ---------- */
.status{display:flex;gap:12px;align-items:flex-start;padding:14px 18px;border-top:1px solid var(--line-2);font-size:13px}
.status .badge{font-family:var(--mono);font-size:11px;letter-spacing:.08em;padding:3px 8px;border-radius:2px;
  flex:0 0 auto;margin-top:1px}
.st-fit .badge{background:var(--accent-soft);color:var(--accent)}
.st-slack .badge{background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.st-over{background:var(--stop-soft)}
.st-over .badge{background:var(--stop);color:#F7EEEE}
.status-body{flex:1 1 auto;min-width:0}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}
.btn{font-family:var(--sans);font-size:12px;border:1px solid var(--ink);background:var(--ink);
  color:var(--surface);padding:6px 12px;border-radius:2px;cursor:pointer}
.btn:hover{background:var(--accent);border-color:var(--accent)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{background:var(--surface-2)}

/* ---------- component cards ---------- */
.cards{display:grid;gap:1px;background:var(--line-2)}
.cards.c4,.cards.c2{grid-template-columns:repeat(2,1fr)}
.card{background:var(--surface);padding:14px 15px;min-width:0;position:relative}
@keyframes flashbg{from{background:var(--accent-soft)}to{background:var(--surface)}}
.card.flash{animation:flashbg 180ms ease-out}
.card.locked{background:#F7FAF9}
.card-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card-label{font-size:11px;color:var(--dim);letter-spacing:.06em}
.card-tier{font-family:var(--mono);font-size:10px;color:var(--faint)}
.card-name{font-size:14px;font-weight:600;margin:5px 0 3px;line-height:1.35}
.card-note{font-size:12px;color:var(--dim);min-height:1.6em}
.card-price{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:19px;font-weight:600;
  margin-top:9px;letter-spacing:-.01em}
.card-price.zero{color:var(--faint)}
.card-time{font-family:var(--mono);font-size:11px;color:var(--warn);margin-top:2px;min-height:1.5em}
.card-time.none{color:var(--faint)}
.card-lock{font-family:var(--mono);font-size:10px;color:var(--accent);background:var(--accent-soft);
  padding:1px 5px;border-radius:2px}
.card.off{opacity:.42}

/* ---------- totals ---------- */
.totals{display:flex;flex-wrap:wrap;border-top:1px solid var(--line-2)}
.tcell{flex:1 1 33%;padding:13px 18px;min-width:0}
.tcell + .tcell{border-left:1px solid var(--line-2)}
.tcell .k{font-size:11px;color:var(--dim);letter-spacing:.05em}
.tcell .v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:20px;font-weight:600;
  letter-spacing:-.01em;margin-top:2px}
.tcell .v.pos{color:var(--accent)} .tcell .v.neg{color:var(--stop)}

/* ---------- tradeoffs ---------- */
.trade{padding:16px 18px 18px}
.trade-list{list-style:none;margin:0;padding:0}
.trade-list li{display:flex;gap:11px;padding:9px 0;border-top:1px dashed var(--line);line-height:1.65}
.trade-list li:first-child{border-top:none;padding-top:0}
.trade-idx{font-family:var(--mono);font-size:11px;color:var(--faint);flex:0 0 auto;margin-top:3px}
.trade-txt{flex:1 1 auto;min-width:0}
.trade-txt .save{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:600}
.trade-txt .cost{color:var(--warn);font-weight:600}
.more{margin-top:10px}
.more button{background:none;border:none;padding:0;font:inherit;font-size:12px;color:var(--accent);
  cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.trade-empty{color:var(--dim);font-size:13px}

/* ---------- 左右对照 ---------- */
.pair{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start;margin-bottom:22px}
.col-hd{display:flex;align-items:baseline;gap:9px;margin-bottom:9px;flex-wrap:wrap}
.col-hd .badge{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;padding:3px 8px;border-radius:2px}
.col.now .badge{background:var(--surface-2);color:var(--dim);border:1px solid var(--line)}
.col.new .badge{background:var(--ink);color:var(--surface)}
.col-hd .t{font-size:13px;font-weight:600}
.col-hd .s{font-family:var(--mono);font-size:10.5px;color:var(--faint);margin-left:auto}
.frame{background:var(--surface);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.fbody{height:660px;overflow-y:auto;overflow-x:hidden;padding:16px;position:relative;scrollbar-width:thin}
.fbody::-webkit-scrollbar{width:6px}
.fbody::-webkit-scrollbar-thumb{background:#C9CFD0;border-radius:3px}
.stick{position:sticky;top:0;z-index:5;background:var(--surface);margin:4px -16px 14px;
  padding:12px 16px;border-top:1px solid var(--line-2);border-bottom:1px solid var(--line-2);
  box-shadow:0 6px 10px -10px rgba(0,0,0,.35)}

/* 现状：文字墙 */
.wall{font-size:13px;line-height:1.85;color:#2B3138}
.wall h4{font-size:14px;font-weight:700;margin:15px 0 6px}
.wall h5{font-size:13px;font-weight:600;margin:12px 0 4px}
.wall p{margin:0 0 8px}
.wall .li{margin:0 0 4px;padding-left:11px;position:relative;color:#454E54}
.wall .li::before{content:"";position:absolute;left:0;top:9px;width:4px;height:4px;border-radius:50%;background:#B6BEC8}
.wall .u{color:var(--accent);text-decoration:underline;text-underline-offset:2px}
.wall .flag{background:var(--warn-soft);color:var(--warn);padding:0 3px;border-radius:2px}
.wall .meta{font-family:var(--mono);font-size:11px;color:var(--faint);letter-spacing:.04em;
  border-top:1px dashed var(--line);margin-top:14px;padding-top:10px}
.wall .budgetbox{border:1px solid var(--line);border-radius:3px;padding:10px 12px;margin:10px 0;background:var(--surface-2)}
.wall .budgetbox .r{display:flex;justify-content:space-between;font-size:12.5px;padding:2px 0}
.wall .budgetbox .r b{font-family:var(--mono);font-variant-numeric:tabular-nums}
.wall .followq{margin-top:14px;border-top:1px solid var(--line-2);padding-top:11px}
.wall .followq .cap{font-size:12px;font-weight:600;margin-bottom:7px}
.wall .followq .q{background:var(--surface-2);border-radius:3px;padding:9px 11px;font-size:12.5px;
  color:#454E54;margin-bottom:6px}

/* ---------- 路线 ---------- */
.route{padding:0}
.day-block{border-top:1px solid var(--line-2);padding:14px 0 4px}
.day-block:first-child{border-top:none;padding-top:4px}
.day-cap{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:9px;flex-wrap:wrap}
.day-cap .d{font-family:var(--mono);font-size:11px;letter-spacing:.09em;color:var(--ink-2)}
.day-cap .theme{font-size:12px;color:var(--dim);flex:1 1 auto}
.day-cap .s{font-family:var(--mono);font-size:10.5px;color:var(--faint)}
.stops{list-style:none;margin:0;padding:0}
.stop{display:flex;gap:10px;padding:8px 0;position:relative}
.stop + .stop{border-top:1px dashed var(--line-2)}
.stop .clock{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:11.5px;color:var(--dim);
  flex:0 0 42px;padding-top:2px}
.stop .rail{flex:0 0 9px;position:relative}
.stop .rail::before{content:"";position:absolute;left:3px;top:6px;width:5px;height:5px;border-radius:50%;
  background:var(--accent)}
.stop .rail::after{content:"";position:absolute;left:5px;top:12px;bottom:-10px;width:1px;background:var(--line)}
.stop:last-child .rail::after{display:none}
.stop.is-move .rail::before{background:var(--hatch-a);border-radius:1px;width:5px;height:5px}
.stop.is-anchor .rail::before{width:9px;height:9px;left:1px;top:4px;background:var(--accent);
  box-shadow:0 0 0 3px var(--accent-soft)}
.stop.is-meal .rail::before{background:var(--warn)}
.stop.is-gap .rail::before{background:var(--line);width:5px;height:5px}
.stop.is-gap .snm,.stop.is-gap .snm .dur{font-weight:400;color:var(--faint)}
.stop .sbody{flex:1 1 auto;min-width:0}
.stop .snm{font-size:13.5px;font-weight:600;line-height:1.4}
.stop .snm .dur{font-family:var(--mono);font-size:11px;font-weight:400;color:var(--faint);margin-left:6px}
.stop .snm .pin{font-family:var(--mono);font-size:10px;color:var(--accent);background:var(--accent-soft);
  padding:1px 5px;border-radius:2px;margin-left:6px;vertical-align:1px}
.stop .swhy{font-size:12.5px;color:var(--dim);line-height:1.6;margin-top:2px}
.stop.is-move .snm{font-weight:500;color:var(--ink-2)}
.stop.is-move .snm .dur{color:var(--warn)}
.stop .opts2{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.stop .opts2 .o{font-size:11.5px;border:1px solid var(--line);border-radius:2px;padding:3px 8px;
  background:var(--surface-2);color:var(--ink-2)}
.stop .opts2 .o b{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:600}
.stop .opts2 .o.gone{opacity:.45;text-decoration:line-through}
.stop .hint{font-family:var(--mono);font-size:10.5px;color:var(--warn);margin-top:5px}
.day-dead{border:1px dashed var(--line);border-radius:3px;padding:16px;text-align:center;
  background:repeating-linear-gradient(45deg,#E7EAEA 0 5px,#EEF0F0 5px 10px)}
.day-dead .k{font-family:var(--mono);font-size:12px;letter-spacing:.14em;color:var(--dim)}
.day-dead .w{font-size:12.5px;color:var(--dim);margin-top:6px}

/* ---------- 行程条 ---------- */
.bar{display:flex;height:20px;border:1px solid var(--line);border-radius:2px;overflow:hidden;
  background:var(--slack);margin-top:9px}
.seg{display:flex;align-items:center;overflow:hidden;white-space:nowrap;font-size:10px;padding:0 4px;
  min-width:0;transition:flex-basis 180ms ease}
.seg-act{background:var(--accent);color:#EAF2F0;border-right:1px solid rgba(255,255,255,.3)}
.seg-anchor{background:var(--accent-2)}
.seg-meal{background:#8A6A3A;color:#F5EDE3;border-right:1px solid rgba(255,255,255,.3)}
.seg-com{background-image:repeating-linear-gradient(45deg,var(--hatch-a) 0 3px,var(--hatch-b) 3px 6px);
  color:var(--ink-2);border-right:1px solid var(--line);min-width:5px}
.seg-slk{background:var(--slack);color:var(--faint)}
.seg-over{background:var(--stop);color:#F7EAEA;border-left:1px solid #fff}
.seg .sm{font-family:var(--mono);font-variant-numeric:tabular-nums}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:10.5px;color:var(--dim);margin-top:6px}
.legend i{display:inline-block;width:12px;height:8px;border-radius:1px;margin-right:4px;border:1px solid var(--line)}
.lg-act{background:var(--accent);border-color:var(--accent)}
.lg-meal{background:#8A6A3A;border-color:#8A6A3A}
.lg-com{background-image:repeating-linear-gradient(45deg,var(--hatch-a) 0 3px,var(--hatch-b) 3px 6px)}
.lg-slk{background:var(--slack)}

/* ---------- 分步问答 ---------- */
.step{padding:16px 18px;border-top:1px solid var(--line-2)}
.step:first-child{border-top:none}
.step-h{display:flex;align-items:baseline;gap:9px;margin-bottom:11px}
.step-n{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;color:var(--faint);
  border:1px solid var(--line);border-radius:2px;padding:1px 5px;flex:0 0 auto}
.step.done .step-n{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.step-q{font-size:16px;font-weight:600;line-height:1.45;letter-spacing:-.01em;margin:0}
.step-q b{box-shadow:inset 0 -9px 0 var(--accent-soft)}
.step-a{font-size:12.5px;color:var(--dim);margin:9px 0 0}
.step-a .re{background:none;border:none;padding:0;font:inherit;font-size:12.5px;color:var(--accent);
  cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.band{display:flex;gap:8px;flex-wrap:wrap}
.bandbtn{font-family:var(--sans);font-size:13.5px;padding:10px 15px;border-radius:3px;cursor:pointer;
  background:var(--surface);border:1.5px solid var(--accent);color:var(--accent);font-weight:600;
  line-height:1.35;text-align:left}
.bandbtn .bs{display:block;font-family:var(--mono);font-size:10.5px;font-weight:400;opacity:.72;margin-top:2px}
.bandbtn:hover{background:var(--accent-soft)}
.bandbtn[aria-pressed=true]{background:var(--accent);color:#F4F9F8;border-color:var(--accent)}
.bandbtn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.subq{font-size:13.5px;color:var(--ink-2);margin:15px 0 0}
.subq b{font-weight:600;color:var(--ink)}
.chosen{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:9px}
.chip{font-family:var(--sans);font-size:12px;padding:4px 9px;border-radius:2px;cursor:pointer;
  background:var(--accent-soft);border:1px solid var(--accent);color:var(--accent)}
.chip b{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;margin-right:5px;opacity:.8}
.chip:hover{background:var(--accent);color:#F4F9F8}
.acard.picked{border:1.5px solid var(--accent);background:var(--accent-soft)}
.daytag{position:absolute;top:9px;right:9px;font-family:var(--mono);font-size:9.5px;
  color:#F4F9F8;background:var(--accent);padding:1px 5px;border-radius:2px}
.fcard{flex:0 0 178px}
.fcard .pnote{min-height:2.6em}
.auto-card{border-style:dashed}
.acard{flex:0 0 205px}
.acard .atags{display:flex;gap:4px;flex-wrap:wrap;min-height:17px;margin-bottom:5px}
.atag{font-family:var(--mono);font-size:9.5px;letter-spacing:.03em;padding:1px 5px;border-radius:2px;
  border:1px solid currentColor}
.t-whole{color:var(--stop)}
.t-book{color:var(--warn)}
.t-uniq{color:var(--accent)}
.t-pop{color:var(--dim)}
.acard .pn{padding-right:0}
.acard .pnote{min-height:3.9em}
.nohit{padding:12px 18px 4px;font-size:13px;color:var(--ink-2)}
.nohit .nh-w{color:var(--faint);font-size:12px;margin-left:8px}
#anchorSearch{margin:2px 18px 4px;max-width:340px;border-color:var(--line)}
#anchorSearch:focus{border-color:var(--accent)}
.wxbar{border:1px solid var(--line);border-left:2px solid var(--accent);border-radius:0 3px 3px 0;
  background:var(--surface-2);padding:11px 14px;margin:0 0 14px}
.wxbar.off{border-left-color:var(--faint);opacity:.85}
.wx-top{display:flex;align-items:baseline;gap:18px;flex-wrap:wrap}
.wx-day{font-size:12.5px;color:var(--ink-2)}
.wx-day b{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;color:var(--dim);
  font-weight:400;margin-right:5px}
.wx-note{color:var(--faint);margin-left:7px}
.wx-btn{margin-left:auto;font-family:var(--sans);font-size:11.5px;background:none;
  border:1px solid var(--line);border-radius:2px;padding:3px 9px;cursor:pointer;color:var(--ink-2)}
.wx-btn:hover{border-color:var(--accent);color:var(--accent)}
.wx-swap{font-size:13px;line-height:1.6;margin-top:7px;padding-top:7px;border-top:1px dashed var(--line)}
.wx-swap b{color:var(--warn);font-weight:600}
.wx-src{font-family:var(--mono);font-size:10px;color:var(--faint);margin-top:6px}
.scale .said{color:var(--accent);font-weight:600}
.vs{font-family:var(--mono);font-size:11.5px;color:var(--warn);margin-left:9px}
.vs.same{color:var(--faint)}
.reveal{animation:rise .34s cubic-bezier(.2,.7,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.first-run>*{animation:rise .3s cubic-bezier(.2,.7,.3,1) both}
.first-run>*:nth-child(1){animation-delay:.02s}
.first-run>*:nth-child(2){animation-delay:.10s}
.first-run>*:nth-child(3){animation-delay:.18s}
.first-run>*:nth-child(4){animation-delay:.24s}
.first-run>*:nth-child(5){animation-delay:.30s}
.first-run>*:nth-child(6){animation-delay:.36s}
.first-run>*:nth-child(7){animation-delay:.42s}
.first-run>*:nth-child(8){animation-delay:.48s}
.first-run>*:nth-child(n+9){animation-delay:.54s}
@media (prefers-reduced-motion:reduce){
  .reveal,.first-run>*{animation:none}
}

/* ---------- 可横滑选择的卡片 ---------- */
.pick-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.unpin{background:none;border:none;padding:0;font:inherit;font-size:11.5px;color:var(--accent);
  cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.pick{display:flex;gap:10px;overflow-x:auto;padding:10px 18px 16px;scroll-snap-type:x proximity;scrollbar-width:thin}
.pick::-webkit-scrollbar{height:6px}
.pick::-webkit-scrollbar-thumb{background:#C9CFD0;border-radius:3px}
.pcard{flex:0 0 170px;scroll-snap-align:start;position:relative;display:block;text-align:left;
  font-family:var(--sans);background:var(--surface);border:1px solid var(--line);border-radius:3px;
  padding:11px 12px;cursor:pointer;color:var(--ink)}
.pcard:hover{border-color:var(--accent)}
.pcard[aria-pressed=true]{border:1.5px solid var(--accent);background:var(--accent-soft)}
.pcard:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.pcard .ptag{position:absolute;top:9px;right:9px;font-family:var(--mono);font-size:9.5px;color:var(--accent);
  background:var(--surface);border:1px solid var(--accent);padding:0 4px;border-radius:2px}
.pcard .ptag.auto{color:var(--faint);border-color:var(--line)}
.pcard .pn{display:block;font-size:13.5px;font-weight:600;line-height:1.35;padding-right:40px}
.pcard .pnote{display:block;font-size:11.5px;color:var(--dim);margin-top:3px;min-height:2.6em;line-height:1.5}
.pcard .pp{display:block;font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:17px;
  font-weight:600;margin-top:6px}
.pcard .pp.zero{color:var(--faint)}
.pcard .pm{display:block;font-family:var(--mono);font-size:10.5px;color:var(--warn);margin-top:2px}
.pcard .pm.none{color:var(--faint)}
.custom-in{display:block;margin-top:10px;width:100%;max-width:320px;font-family:var(--sans);font-size:13.5px;
  padding:8px 11px;border:1.5px solid var(--accent);border-radius:3px;background:var(--surface);color:var(--ink)}
.custom-in:focus{outline:2px solid var(--accent);outline-offset:1px}

/* ---------- tally ---------- */
.tally{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:22px}
.tbox{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:14px 16px}
.tbox .cap{font-size:12px;font-weight:700;padding-bottom:8px;border-bottom:1px solid var(--line-2);margin-bottom:4px}
.trow{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:7px 0;
  border-bottom:1px solid #F0F2F2;font-size:12.5px;color:var(--dim)}
.trow:last-child{border-bottom:none}
.trow b{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:13px;color:var(--ink);
  text-align:right;flex:0 0 auto}
.trow b.good{color:var(--accent)} .trow b.bad{color:var(--stop)}

/* ---------- 收尾 ---------- */
.tblwrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:13px}
th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--line-2);vertical-align:top}
thead th{font-size:11px;letter-spacing:.06em;color:var(--dim);font-weight:600;
  border-bottom:1px solid var(--line);white-space:nowrap}
tbody th{font-weight:500;color:var(--ink-2);white-space:nowrap}
td.ours{background:var(--accent-soft);color:var(--accent);font-weight:600}
thead th.ours{background:var(--accent-soft);color:var(--accent)}
tbody tr:last-child th,tbody tr:last-child td{border-bottom:none}
.fine{font-size:12px;color:var(--dim);line-height:1.8;margin:16px 0 0;max-width:72ch}
.closing{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:20px 22px;margin-bottom:16px}
.closing h3{font-size:16px;font-weight:650;margin:0 0 5px}
.closing .sub{font-size:13px;color:var(--dim);margin:0 0 14px}
.closing ol{margin:0;padding-left:20px}
.closing li{font-size:13.5px;line-height:1.8;margin-bottom:8px;color:#2B3138}
.closing li b{font-weight:650}
.closing .kept{margin-top:14px;padding-top:12px;border-top:1px solid var(--line-2);
  font-size:13px;color:var(--dim);line-height:1.8}
.closing .kept b{color:var(--ink)}
.foot{margin-top:34px;padding-top:16px;border-top:1px solid var(--line);
  font-family:var(--mono);font-size:11px;color:var(--faint);letter-spacing:.03em}

@media (max-width:960px){
  .pair,.tally{grid-template-columns:1fr}
  .fbody{height:auto;max-height:none}
  .stick{position:static;box-shadow:none}
}
@media (max-width:620px){
  body{padding:22px 14px 56px}
  h1{font-size:22px}
  .cards.c4,.cards.c2{grid-template-columns:1fr}
  .tcell{flex:1 1 100%}
  .tcell + .tcell{border-left:none;border-top:1px solid var(--line-2)}
  .seg .sm{display:none}
  .readout .cur{font-size:26px}
  .stop .clock{flex:0 0 38px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* 拆分版是产品本身，不再并排放「现状」那一栏 */
.pair{display:block}
.col.now{display:none}
.col.new{max-width:none}
.frame{border:none;background:none;padding:0}
.fbody{max-height:none;overflow:visible}
.dialogue{padding:20px;background:var(--surface);border:1px solid var(--line);border-radius:6px;margin-bottom:18px}
.dialogue h2{font-size:19px;margin:0 0 14px}
.dialogue label{display:block;margin:16px 0 6px}
.conversation-input{display:flex;gap:8px}
.conversation-input input{min-width:0;flex:1;padding:12px;font:inherit;border:1px solid var(--line);border-radius:4px}
.message{white-space:pre-wrap;padding:10px 12px;background:var(--surface-2);border-radius:4px}
.message.user{margin-left:20px;background:var(--accent-soft)}
.dialogue-actions{margin-top:12px}
.change-preview{margin-top:14px;padding:12px;border:1px solid var(--accent);border-radius:4px}
.plan-details{padding:12px 0;border-top:1px solid var(--line)}
.plan-details summary{cursor:pointer;padding:4px 18px;font-weight:600}
[hidden]{display:none!important}
</style>
