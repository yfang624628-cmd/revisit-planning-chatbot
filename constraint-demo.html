<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>行程规划助手</title>
<style>
:root{
  --bg:#E7EAEA; --surface:#FCFCFB; --surface-2:#F2F4F4;
  --line:#D0D5D6; --line-2:#E0E4E4;
  --ink:#14181A; --ink-2:#3C4448; --dim:#687277; --faint:#8E979B;
  --accent:#0B6157; --accent-2:#0E7A6D; --accent-soft:#DDEBE8;
  --warn:#94501A; --warn-soft:#F4E9DE;
  --stop:#7E3030; --stop-soft:#F2E5E5;
  --hatch-a:#C3C9CB; --hatch-b:#D6DBDC; --slack:#E9ECEC;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
  font-size:14px;line-height:1.6;padding:32px 20px 72px}
.wrap{max-width:1000px;margin:0 auto}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;letter-spacing:-.01em}

/* ---------- masthead ---------- */
.masthead{border-bottom:2px solid var(--ink);padding-bottom:18px;margin-bottom:26px}
.kicker{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
h1{font-size:27px;line-height:1.25;margin:10px 0 8px;letter-spacing:-.01em;font-weight:650}
.claim{color:var(--ink-2);max-width:64ch;margin:0}
.claim b{font-weight:650;color:var(--ink);box-shadow:inset 0 -8px 0 var(--accent-soft)}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.tabs button{font-family:var(--sans);font-size:13.5px;padding:10px 16px;border-radius:3px;cursor:pointer;
  background:var(--surface);border:1px solid var(--line);color:var(--ink-2);text-align:left;line-height:1.4}
.tabs button .sub{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;
  color:var(--faint);margin-top:2px}
.tabs button[aria-current=true]{background:var(--ink);border-color:var(--ink);color:var(--surface);font-weight:600}
.tabs button[aria-current=true] .sub{color:#9BA6A4}
.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- panels ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:4px;margin-bottom:16px}
.pad{padding:18px}
.divider{height:1px;background:var(--line-2)}
.sec-h{font-size:11px;color:var(--dim);letter-spacing:.06em;margin-bottom:11px}

/* ---------- 收窄：第一句 ---------- */
.ask{background:var(--surface-2);border-left:2px solid var(--ink);padding:11px 14px;
  font-size:13.5px;color:var(--ink-2);margin:0 0 14px;border-radius:0 3px 3px 0}
.ask b{color:var(--ink);font-weight:600}
.narrow-q{font-size:17px;font-weight:600;line-height:1.5;margin:0 0 4px;letter-spacing:-.01em}
.narrow-q b{box-shadow:inset 0 -9px 0 var(--accent-soft)}
.narrow-why{font-size:12.5px;color:var(--dim);margin:0 0 13px}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opt{font-family:var(--sans);font-size:13.5px;padding:9px 15px;border-radius:3px;cursor:pointer;
  background:var(--surface);border:1.5px solid var(--accent);color:var(--accent);font-weight:600;line-height:1.35}
.opt .op-sub{display:block;font-family:var(--mono);font-size:10.5px;font-weight:400;opacity:.72;margin-top:2px}
.opt:hover{background:var(--accent-soft)}
.opt[aria-pressed=true]{background:var(--accent);color:#F4F9F8;border-color:var(--accent)}
.opt:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* ---------- slider ---------- */
.ctl{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.ctl-label{font-size:12px;color:var(--dim);letter-spacing:.04em;flex:0 0 auto}
.readout .cur{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:30px;
  font-weight:600;letter-spacing:-.02em;display:inline-block;text-align:left}
#budgetOutA{min-width:6.6ch}
#budgetOutB{min-width:5.4ch}
.slider-line{flex:1 1 320px;min-width:200px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;background:transparent;margin:0;display:block}
input[type=range]:focus{outline:none}
input[type=range]:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 3px var(--accent-soft)}
input[type=range]:focus-visible::-moz-range-thumb{box-shadow:0 0 0 3px var(--accent-soft)}
input[type=range]::-webkit-slider-runnable-track{height:4px;background:var(--line);border-radius:2px}
input[type=range]::-moz-range-track{height:4px;background:var(--line);border-radius:2px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;height:22px;width:12px;border-radius:2px;
  background:var(--ink);border:none;margin-top:-9px;cursor:grab}
input[type=range]::-moz-range-thumb{height:22px;width:12px;border-radius:2px;background:var(--ink);border:none;cursor:grab}
input[type=range]:active::-webkit-slider-thumb{cursor:grabbing;background:var(--accent)}
input[type=range]:active::-moz-range-thumb{cursor:grabbing;background:var(--accent)}
.scale{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--faint);margin-top:6px}

/* ---------- status ---------- */
.status{display:flex;gap:12px;align-items:flex-start;padding:14px 18px;border-top:1px solid var(--line-2);font-size:13px}
.status .badge{font-family:var(--mono);font-size:11px;letter-spacing:.08em;padding:3px 8px;border-radius:2px;
  flex:0 0 auto;margin-top:1px}
.st-fit .badge{background:var(--accent-soft);color:var(--accent)}
.st-slack .badge{background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.st-over{background:var(--stop-soft)}
.st-over .badge{background:var(--stop);color:#F7EEEE}
.status-body{flex:1 1 auto;min-width:0}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}
.btn{font-family:var(--sans);font-size:12px;border:1px solid var(--ink);background:var(--ink);
  color:var(--surface);padding:6px 12px;border-radius:2px;cursor:pointer}
.btn:hover{background:var(--accent);border-color:var(--accent)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{background:var(--surface-2)}

/* ---------- component cards ---------- */
.cards{display:grid;gap:1px;background:var(--line-2)}
.cards.c4,.cards.c2{grid-template-columns:repeat(2,1fr)}
.card{background:var(--surface);padding:14px 15px;min-width:0;position:relative}
@keyframes flashbg{from{background:var(--accent-soft)}to{background:var(--surface)}}
.card.flash{animation:flashbg 180ms ease-out}
.card.locked{background:#F7FAF9}
.card-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card-label{font-size:11px;color:var(--dim);letter-spacing:.06em}
.card-tier{font-family:var(--mono);font-size:10px;color:var(--faint)}
.card-name{font-size:14px;font-weight:600;margin:5px 0 3px;line-height:1.35}
.card-note{font-size:12px;color:var(--dim);min-height:1.6em}
.card-price{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:19px;font-weight:600;
  margin-top:9px;letter-spacing:-.01em}
.card-price.zero{color:var(--faint)}
.card-time{font-family:var(--mono);font-size:11px;color:var(--warn);margin-top:2px;min-height:1.5em}
.card-time.none{color:var(--faint)}
.card-lock{font-family:var(--mono);font-size:10px;color:var(--accent);background:var(--accent-soft);
  padding:1px 5px;border-radius:2px}
.card.off{opacity:.42}

/* ---------- totals ---------- */
.totals{display:flex;flex-wrap:wrap;border-top:1px solid var(--line-2)}
.tcell{flex:1 1 33%;padding:13px 18px;min-width:0}
.tcell + .tcell{border-left:1px solid var(--line-2)}
.tcell .k{font-size:11px;color:var(--dim);letter-spacing:.05em}
.tcell .v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:20px;font-weight:600;
  letter-spacing:-.01em;margin-top:2px}
.tcell .v.pos{color:var(--accent)} .tcell .v.neg{color:var(--stop)}

/* ---------- tradeoffs ---------- */
.trade{padding:16px 18px 18px}
.trade-list{list-style:none;margin:0;padding:0}
.trade-list li{display:flex;gap:11px;padding:9px 0;border-top:1px dashed var(--line);line-height:1.65}
.trade-list li:first-child{border-top:none;padding-top:0}
.trade-idx{font-family:var(--mono);font-size:11px;color:var(--faint);flex:0 0 auto;margin-top:3px}
.trade-txt{flex:1 1 auto;min-width:0}
.trade-txt .save{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:600}
.trade-txt .cost{color:var(--warn);font-weight:600}
.more{margin-top:10px}
.more button{background:none;border:none;padding:0;font:inherit;font-size:12px;color:var(--accent);
  cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.trade-empty{color:var(--dim);font-size:13px}

/* ---------- 左右对照 ---------- */
.pair{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start;margin-bottom:22px}
.col-hd{display:flex;align-items:baseline;gap:9px;margin-bottom:9px;flex-wrap:wrap}
.col-hd .badge{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;padding:3px 8px;border-radius:2px}
.col.now .badge{background:var(--surface-2);color:var(--dim);border:1px solid var(--line)}
.col.new .badge{background:var(--ink);color:var(--surface)}
.col-hd .t{font-size:13px;font-weight:600}
.col-hd .s{font-family:var(--mono);font-size:10.5px;color:var(--faint);margin-left:auto}
.frame{background:var(--surface);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.fbody{height:660px;overflow-y:auto;overflow-x:hidden;padding:16px;position:relative;scrollbar-width:thin}
.fbody::-webkit-scrollbar{width:6px}
.fbody::-webkit-scrollbar-thumb{background:#C9CFD0;border-radius:3px}
.stick{position:sticky;top:0;z-index:5;background:var(--surface);margin:4px -16px 14px;
  padding:12px 16px;border-top:1px solid var(--line-2);border-bottom:1px solid var(--line-2);
  box-shadow:0 6px 10px -10px rgba(0,0,0,.35)}

/* 现状：文字墙 */
.wall{font-size:13px;line-height:1.85;color:#2B3138}
.wall h4{font-size:14px;font-weight:700;margin:15px 0 6px}
.wall h5{font-size:13px;font-weight:600;margin:12px 0 4px}
.wall p{margin:0 0 8px}
.wall .li{margin:0 0 4px;padding-left:11px;position:relative;color:#454E54}
.wall .li::before{content:"";position:absolute;left:0;top:9px;width:4px;height:4px;border-radius:50%;background:#B6BEC8}
.wall .u{color:var(--accent);text-decoration:underline;text-underline-offset:2px}
.wall .flag{background:var(--warn-soft);color:var(--warn);padding:0 3px;border-radius:2px}
.wall .meta{font-family:var(--mono);font-size:11px;color:var(--faint);letter-spacing:.04em;
  border-top:1px dashed var(--line);margin-top:14px;padding-top:10px}
.wall .budgetbox{border:1px solid var(--line);border-radius:3px;padding:10px 12px;margin:10px 0;background:var(--surface-2)}
.wall .budgetbox .r{display:flex;justify-content:space-between;font-size:12.5px;padding:2px 0}
.wall .budgetbox .r b{font-family:var(--mono);font-variant-numeric:tabular-nums}
.wall .followq{margin-top:14px;border-top:1px solid var(--line-2);padding-top:11px}
.wall .followq .cap{font-size:12px;font-weight:600;margin-bottom:7px}
.wall .followq .q{background:var(--surface-2);border-radius:3px;padding:9px 11px;font-size:12.5px;
  color:#454E54;margin-bottom:6px}

/* ---------- 路线 ---------- */
.route{padding:0}
.day-block{border-top:1px solid var(--line-2);padding:14px 0 4px}
.day-block:first-child{border-top:none;padding-top:4px}
.day-cap{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:9px;flex-wrap:wrap}
.day-cap .d{font-family:var(--mono);font-size:11px;letter-spacing:.09em;color:var(--ink-2)}
.day-cap .theme{font-size:12px;color:var(--dim);flex:1 1 auto}
.day-cap .s{font-family:var(--mono);font-size:10.5px;color:var(--faint)}
.stops{list-style:none;margin:0;padding:0}
.stop{display:flex;gap:10px;padding:8px 0;position:relative}
.stop + .stop{border-top:1px dashed var(--line-2)}
.stop .clock{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:11.5px;color:var(--dim);
  flex:0 0 42px;padding-top:2px}
.stop .rail{flex:0 0 9px;position:relative}
.stop .rail::before{content:"";position:absolute;left:3px;top:6px;width:5px;height:5px;border-radius:50%;
  background:var(--accent)}
.stop .rail::after{content:"";position:absolute;left:5px;top:12px;bottom:-10px;width:1px;background:var(--line)}
.stop:last-child .rail::after{display:none}
.stop.is-move .rail::before{background:var(--hatch-a);border-radius:1px;width:5px;height:5px}
.stop.is-anchor .rail::before{width:9px;height:9px;left:1px;top:4px;background:var(--accent);
  box-shadow:0 0 0 3px var(--accent-soft)}
.stop.is-meal .rail::before{background:var(--warn)}
.stop.is-gap .rail::before{background:var(--line);width:5px;height:5px}
.stop.is-gap .snm,.stop.is-gap .snm .dur{font-weight:400;color:var(--faint)}
.stop .sbody{flex:1 1 auto;min-width:0}
.stop .snm{font-size:13.5px;font-weight:600;line-height:1.4}
.stop .snm .dur{font-family:var(--mono);font-size:11px;font-weight:400;color:var(--faint);margin-left:6px}
.stop .snm .pin{font-family:var(--mono);font-size:10px;color:var(--accent);background:var(--accent-soft);
  padding:1px 5px;border-radius:2px;margin-left:6px;vertical-align:1px}
.stop .swhy{font-size:12.5px;color:var(--dim);line-height:1.6;margin-top:2px}
.stop.is-move .snm{font-weight:500;color:var(--ink-2)}
.stop.is-move .snm .dur{color:var(--warn)}
.stop .opts2{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.stop .opts2 .o{font-size:11.5px;border:1px solid var(--line);border-radius:2px;padding:3px 8px;
  background:var(--surface-2);color:var(--ink-2)}
.stop .opts2 .o b{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:600}
.stop .opts2 .o.gone{opacity:.45;text-decoration:line-through}
.stop .hint{font-family:var(--mono);font-size:10.5px;color:var(--warn);margin-top:5px}
.day-dead{border:1px dashed var(--line);border-radius:3px;padding:16px;text-align:center;
  background:repeating-linear-gradient(45deg,#E7EAEA 0 5px,#EEF0F0 5px 10px)}
.day-dead .k{font-family:var(--mono);font-size:12px;letter-spacing:.14em;color:var(--dim)}
.day-dead .w{font-size:12.5px;color:var(--dim);margin-top:6px}

/* ---------- 行程条 ---------- */
.bar{display:flex;height:20px;border:1px solid var(--line);border-radius:2px;overflow:hidden;
  background:var(--slack);margin-top:9px}
.seg{display:flex;align-items:center;overflow:hidden;white-space:nowrap;font-size:10px;padding:0 4px;
  min-width:0;transition:flex-basis 180ms ease}
.seg-act{background:var(--accent);color:#EAF2F0;border-right:1px solid rgba(255,255,255,.3)}
.seg-anchor{background:var(--accent-2)}
.seg-meal{background:#8A6A3A;color:#F5EDE3;border-right:1px solid rgba(255,255,255,.3)}
.seg-com{background-image:repeating-linear-gradient(45deg,var(--hatch-a) 0 3px,var(--hatch-b) 3px 6px);
  color:var(--ink-2);border-right:1px solid var(--line);min-width:5px}
.seg-slk{background:var(--slack);color:var(--faint)}
.seg-over{background:var(--stop);color:#F7EAEA;border-left:1px solid #fff}
.seg .sm{font-family:var(--mono);font-variant-numeric:tabular-nums}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:10.5px;color:var(--dim);margin-top:6px}
.legend i{display:inline-block;width:12px;height:8px;border-radius:1px;margin-right:4px;border:1px solid var(--line)}
.lg-act{background:var(--accent);border-color:var(--accent)}
.lg-meal{background:#8A6A3A;border-color:#8A6A3A}
.lg-com{background-image:repeating-linear-gradient(45deg,var(--hatch-a) 0 3px,var(--hatch-b) 3px 6px)}
.lg-slk{background:var(--slack)}

/* ---------- 分步问答 ---------- */
.step{padding:16px 18px;border-top:1px solid var(--line-2)}
.step:first-child{border-top:none}
.step-h{display:flex;align-items:baseline;gap:9px;margin-bottom:11px}
.step-n{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;color:var(--faint);
  border:1px solid var(--line);border-radius:2px;padding:1px 5px;flex:0 0 auto}
.step.done .step-n{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.step-q{font-size:16px;font-weight:600;line-height:1.45;letter-spacing:-.01em;margin:0}
.step-q b{box-shadow:inset 0 -9px 0 var(--accent-soft)}
.step-a{font-size:12.5px;color:var(--dim);margin:9px 0 0}
.step-a .re{background:none;border:none;padding:0;font:inherit;font-size:12.5px;color:var(--accent);
  cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.band{display:flex;gap:8px;flex-wrap:wrap}
.bandbtn{font-family:var(--sans);font-size:13.5px;padding:10px 15px;border-radius:3px;cursor:pointer;
  background:var(--surface);border:1.5px solid var(--accent);color:var(--accent);font-weight:600;
  line-height:1.35;text-align:left}
.bandbtn .bs{display:block;font-family:var(--mono);font-size:10.5px;font-weight:400;opacity:.72;margin-top:2px}
.bandbtn:hover{background:var(--accent-soft)}
.bandbtn[aria-pressed=true]{background:var(--accent);color:#F4F9F8;border-color:var(--accent)}
.bandbtn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.subq{font-size:13.5px;color:var(--ink-2);margin:15px 0 0}
.subq b{font-weight:600;color:var(--ink)}
.chosen{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:9px}
.chip{font-family:var(--sans);font-size:12px;padding:4px 9px;border-radius:2px;cursor:pointer;
  background:var(--accent-soft);border:1px solid var(--accent);color:var(--accent)}
.chip b{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;margin-right:5px;opacity:.8}
.chip:hover{background:var(--accent);color:#F4F9F8}
.acard.picked{border:1.5px solid var(--accent);background:var(--accent-soft)}
.daytag{position:absolute;top:9px;right:9px;font-family:var(--mono);font-size:9.5px;
  color:#F4F9F8;background:var(--accent);padding:1px 5px;border-radius:2px}
.fcard{flex:0 0 178px}
.fcard .pnote{min-height:2.6em}
.auto-card{border-style:dashed}
.acard{flex:0 0 205px}
.acard .atags{display:flex;gap:4px;flex-wrap:wrap;min-height:17px;margin-bottom:5px}
.atag{font-family:var(--mono);font-size:9.5px;letter-spacing:.03em;padding:1px 5px;border-radius:2px;
  border:1px solid currentColor}
.t-whole{color:var(--stop)}
.t-book{color:var(--warn)}
.t-uniq{color:var(--accent)}
.t-pop{color:var(--dim)}
.acard .pn{padding-right:0}
.acard .pnote{min-height:3.9em}
.nohit{padding:12px 18px 4px;font-size:13px;color:var(--ink-2)}
.nohit .nh-w{color:var(--faint);font-size:12px;margin-left:8px}
#anchorSearch{margin:2px 18px 4px;max-width:340px;border-color:var(--line)}
#anchorSearch:focus{border-color:var(--accent)}
.wxbar{border:1px solid var(--line);border-left:2px solid var(--accent);border-radius:0 3px 3px 0;
  background:var(--surface-2);padding:11px 14px;margin:0 0 14px}
.wxbar.off{border-left-color:var(--faint);opacity:.85}
.wx-top{display:flex;align-items:baseline;gap:18px;flex-wrap:wrap}
.wx-day{font-size:12.5px;color:var(--ink-2)}
.wx-day b{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;color:var(--dim);
  font-weight:400;margin-right:5px}
.wx-note{color:var(--faint);margin-left:7px}
.wx-btn{margin-left:auto;font-family:var(--sans);font-size:11.5px;background:none;
  border:1px solid var(--line);border-radius:2px;padding:3px 9px;cursor:pointer;color:var(--ink-2)}
.wx-btn:hover{border-color:var(--accent);color:var(--accent)}

.vs{font-family:var(--mono);font-size:11.5px;color:var(--warn);margin-left:9px}

.reveal{animation:rise .34s cubic-bezier(.2,.7,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.first-run>*{animation:rise .3s cubic-bezier(.2,.7,.3,1) both}
.first-run>*:nth-child(1){animation-delay:.02s}
.first-run>*:nth-child(2){animation-delay:.10s}

@media (prefers-reduced-motion:reduce){

}

/* ---------- 可横滑选择的卡片 ---------- */
.pick-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.unpin{background:none;border:none;padding:0;font:inherit;font-size:11.5px;color:var(--accent);
  cursor:pointer;text-decoration:underline;text-underline-offset:3px}

.pick::-webkit-scrollbar{height:6px}
.pick::-webkit-scrollbar-thumb{background:#C9CFD0;border-radius:3px}
.pcard{flex:0 0 170px;scroll-snap-align:start;position:relative;display:block;text-align:left;

.custom-in{display:block;margin-top:10px;width:100%;max-width:320px;font-family:var(--sans);font-size:13.5px;
  padding:8px 11px;border:1.5px solid var(--accent);border-radius:3px;background:var(--surface);color:var(--ink)}

/* ---------- tally ---------- */
.tally{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:22px}
.tbox{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:14px 16px}

  text-align:right;flex:0 0 auto}

/* ---------- 收尾 ---------- */
.tblwrap{overflow-x:auto}

  border-bottom:1px solid var(--line);white-space:nowrap}

@media (max-width:960px){

<body>
<div class="wrap">

<header class="masthead">
  <h1>行程规划助手</h1>
  <p class="kicker" style="margin-top:6px">香港数据快照 2026-09 · 地点与坐标来自 OpenStreetMap，门票 / 房价 / 人均为示例数据，非实时报价</p>
</header>

<div class="tabs" id="tabs">
  <button data-s="plan" aria-current="true">出发之前 · 香港两天，一个人 1500 以内</button>
  <button data-s="now" aria-current="false">已经在路上 · 我在中环，还有三小时</button>
</div>

<div class="pair">
  <div class="col now">
    <div class="col-hd"><span class="badge">现状</span><span class="t" id="nowT">实测回答</span><span class="s" id="nowS"></span></div>
    <div class="frame"><div class="fbody" id="nowBody"></div></div>
  </div>
  <div class="col new">
    <div class="col-hd"><span class="badge">改版</span><span class="t">行程规划助手</span></div>
    <div class="frame"><div class="fbody" id="newBody"></div></div>
  </div>
</div>


</div>

<script src="hk-data.js"></script>
<script>
"use strict";

/* ==================================================================
   数据。价格、营业时间、时长全部来自实测截图，未作修改。
   ================================================================== */

/* ---------- 场景 A：组件全部由 hk-data.js 生成 ---------- */
let A_COMPONENTS = null, A_SEQ = null, A_TOP = null;

function byId(list,id){ for (let i=0;i<list.length;i++){ if (list[i].id===id) return list[i]; } return null; }
function areaName(a){ return HK.areas[a] ? HK.areas[a].n : a; }
function sideOf(a){ return HK.areas[a] ? HK.areas[a].side : 'kln'; }
function hopMin(a,b){
  if (a===b) return 0;
  const h = HK.hop[a+'|'+b] || HK.hop[b+'|'+a];
  if (h) return h;
  const sa = sideOf(a), sb = sideOf(b);
  if (sa==='out' || sb==='out') return 70;
  return sa===sb ? 25 : 40;
}
function hhmm(m){ m=((m%1440)+1440)%1440;
  return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0'); }
function mins(hhmmStr){ const p=hhmmStr.split(':'); return parseInt(p[0],10)*60+parseInt(p[1],10); }
function money(n){ return '¥' + n.toLocaleString('en-US'); }

function initA(){
  A_COMPONENTS = {
    transport: { label:'往返交通', tiers: HK.transports.map(function(t){
      return { id:t.id, name:t.n, price:t.price, minutes:t.extra, note:t.note, down:t.down }; }) },
    stay: { label:'住宿', tiers: HK.stays.map(function(s){
      return { id:s.id, name:s.n, price:s.price, minutes:s.commute*2, area:s.area,
               note:s.note + ' · ' + areaName(s.area), down:s.down }; }) },
    food: { label:'餐饮', tiers: HK.foods.map(function(f){
      return { id:f.id, name:f.n, price:f.price, minutes:0, note:f.note, down:f.down }; }) },
    sights: { label:'逛多少', tiers: HK.sightPlans.map(function(p){
      return { id:p.id, name:p.n, price:0, minutes:0, note:'', down:p.down }; }) },
    anchor: { label:'锚点', tiers: HK.sights.map(function(s){
        return { id:s.id, name:s.n, price:s.price, minutes:0, area:s.area, book:!!s.book, cat:s.cat,
                 note:(s.price?money(s.price):'免费') + (s.book?' · 需预约':'') + ' · ' + areaName(s.area) };
      }).concat([
        { id:'custom', name:'自己填的地方', price:0, minutes:0, cat:'其他', note:'费用没算进总价' },
        { id:'__picked', name:'（还没选）', price:0, minutes:0, cat:'其他', note:'' }
      ]) }
  };
  A_TOP = { transport:HK.transports[0].id, stay:HK.stays[0].id, food:HK.foods[0].id,
            sights:HK.sightPlans[0].id, anchor:'__picked' };
  A_SEQ = buildSeq(['food','stay','sights','transport']);
}

/* ---------- 档位：住宿三档、吃饭三档。选了档位＝只在这档里排 ---------- */
const A_BANDS = {
  stay: [
    { id:'lux',  n:'高档型', lo:900,  hi:1e9, sub:'¥900 起' },
    { id:'mid',  n:'舒适型', lo:400,  hi:900, sub:'¥400–900' },
    { id:'econ', n:'经济型', lo:0,    hi:400, sub:'¥400 以下' }
  ],
  food: [
    { id:'fine',   n:'讲究一顿', lo:350, hi:1e9, sub:'老字号 / 烧鹅 / 点心' },
    { id:'proper', n:'正经吃饭', lo:150, hi:350, sub:'茶餐厅 / 大排档' },
    { id:'light',  n:'垫一下就行', lo:0, hi:150, sub:'街边小食 / 便利店' }
  ]
};
const A_BAND_Q = {
  stay:'住哪一档？<b>先定价位，再挑具体哪一家。</b>',
  food:'两天四顿。<b>吃饭想吃到什么程度？</b>'
};
function bandOf(key,id){ return byId(A_BANDS[key],id); }
/* 该档里有哪些具体选项（保留原顺序＝按价降序）。'none'（不住）永远留着当兜底 */
function bandIds(key,bandId){
  const b = bandOf(key,bandId);
  if (!b) return null;
  const ids = A_COMPONENTS[key].tiers.filter(function(t){
    return t.price >= b.lo && t.price < b.hi;
  }).map(function(t){ return t.id; });
  if (key==='stay' && b.id==='econ' && ids.indexOf('none')<0) ids.push('none');
  return ids.length ? ids : null;
}
function bandCount(key,bandId){ const a = bandIds(key,bandId); return a ? a.length : 0; }

/* 降级序列：按「先吃、再住、再景点、最后交通」轮着往下降一档，直到全部见底。
   allow 限定了某个部件只能在这些档里动——用户选了价位，降级就不许跳出这个价位。 */
function buildSeq(order,allow){
  const idx = {}, seq = [];
  order.forEach(function(k){ idx[k] = 0; });
  let moved = true;
  while (moved){
    moved = false;
    order.forEach(function(k){
      const ts = (allow && allow[k])
        ? A_COMPONENTS[k].tiers.filter(function(t){ return allow[k].indexOf(t.id)>=0; })
        : A_COMPONENTS[k].tiers;
      if (idx[k] < ts.length-1){
        idx[k]++; moved = true;
        seq.push({ key:k, to:ts[idx[k]].id, cost:ts[idx[k]].down || '' });
      }
    });
  }
  return seq;
}

/* ---------- 作息：一天的边界条件。决定能塞几个点、夜里的点进不进得来 ---------- */
const A_RHYTHM = [
  { id:'early', n:'早出早归', sub:'08:30 出门 · 19:30 收', start:'08:30', end:'19:30',
    night:-1, m1:'17:30', m2:'12:00',
    a:'08:30 出门，19:30 收工。早市是活的，代价是庙街和跑马地排不进来。' },
  { id:'normal', n:'正常', sub:'09:30 – 21:00', start:'09:30', end:'21:00',
    night:0, m1:'18:00', m2:'12:30',
    a:'09:30 出门，21:00 收工。夜市能赶上，跑马地赶不上。' },
  { id:'late', n:'晚出晚归', sub:'11:00 出门 · 23:00 收', start:'11:00', end:'23:00',
    night:2, m1:'19:00', m2:'13:00',
    a:'11:00 出门，23:00 收工。庙街十点才热闹、幻彩咏香江八点、煤气灯天黑才点——都在这一档里。' }
];
function rhythmOf(){ return byId(A_RHYTHM, aRhythm) || A_RHYTHM[1]; }
function wxNow(){ return aIgnoreWx ? [null,null] : [HK.weather.d1, HK.weather.d2]; }
function dayMinutes(R){ return mins(R.end) - mins(R.start); }

/* ---------- 规划器：锚点 → 逛什么 → 排成两天 ---------- */
function anchorSight(id){
  if (id === 'nope')   return byId(HK.sights,'daikwun');
  if (id === 'custom') return { id:'custom', n:customName(), area:'tst', price:0, dur:60,
    from:'00:00', to:'23:59', cat:'外', w:9, tags:[],
    why:'你自己填的，排在最前面，其余按顺路排。', tip:'' };
  return byId(HK.sights,id) || byId(HK.sights,'daikwun');
}

const SP_CACHE = {};
/* 选逛哪些：同侧优先、离锚点近的优先、权重高的优先，付费的受配额卡着 */
/* 天气打分：下雨把露天的往后压，晴天把露天的往前提；8 号风球直接砍掉停运的 */
function wxScore(s,wx){
  if (!wx) return 0;
  const c = s.cover || 'half';
  if (wx.rain >= 70) return c==='in' ? 20 : (c==='half' ? 6 : -26);
  if (wx.rain >= 40) return c==='in' ? 7  : (c==='half' ? 2 : -8);
  return c==='open' ? 8 : 0;
}
function wxDrop(s,wx){ return !!(wx && wx.wind8 && s.wind); }

function sightPick(anchorIds, planId, rhythmId, wx1, wx2){
  const ids = [].concat(anchorIds);
  const wk = function(w){ return w ? (w.rain + (w.wind8?'T':'')) : '-'; };
  const key = ids.join(',') + '|' + planId + '|' + rhythmId + '|' + wk(wx1) + '|' + wk(wx2) + '|' +
              (ids.indexOf('custom')>=0 ? customName() : '');
  if (SP_CACHE[key]) return SP_CACHE[key];
  const A = anchorSight(ids[0]);
  const A2 = ids[1] ? anchorSight(ids[1]) : null;
  const R = byId(A_RHYTHM, rhythmId) || A_RHYTHM[1];
  const endM = mins(R.end), dayM = dayMinutes(R);
  const plan = byId(HK.sightPlans, planId) || HK.sightPlans[0];
  const quota = { left: plan.max };
  const used = A2 ? [A.id, A2.id] : [A.id];
  function isNight(s){ return !!(s.tags && s.tags.indexOf('night')>=0); }

  function gather(seedArea, side, cap, wx){
    const out = []; let spent = 0, cur = seedArea;
    const cands = HK.sights.filter(function(s){
      if (used.indexOf(s.id) >= 0 || sideOf(s.area) !== side) return false;
      if (wxDrop(s,wx)) return false;                  /* 风球下停运的，不排 */
      /* 开门太晚 → 这个作息下根本逛不完，直接不考虑（留 30 分钟回程） */
      return mins(s.from) + s.dur <= endM - 30;
    }).map(function(s){
      let sc = s.pop*10 - hopMin(seedArea,s.area)/2;
      if (isNight(s)) sc += R.night * 12;              /* 晚归加权，早出降权 */
      if (mins(s.from) <= 540) sc += (R.id==='early' ? 10 : 0);  /* 早出：早开门的点更值 */
      sc += wxScore(s,wx);
      return { s:s, score: sc };
    }).sort(function(x,y){ return y.score - x.score; });
    cands.forEach(function(c){
      const s = c.s;
      if (out.length >= 4) return;
      const cost = s.dur + hopMin(cur, s.area);
      if (spent + cost > cap) return;
      if (s.price > 0){ if (quota.left <= 0) return; quota.left--; }
      out.push(s); used.push(s.id); spent += cost; cur = s.area;
    });
    return out;
  }

  const side1 = sideOf(A.area);
  const d1 = gather(A.area, side1, Math.round(dayM*0.58) - A.dur, wx1).concat([A]);

  /* 第二天：有第二个锚点就围着它排，没有就换一侧 */
  const side2 = A2 ? sideOf(A2.area) : (side1 === 'kln' ? 'hk' : 'kln');
  const seed2 = A2 ? A2.area : (side2==='kln' ? 'tst' : 'central');
  const cap2 = Math.round(dayM*0.55) - (A2 ? A2.dur : 0);
  const d2 = gather(seed2, side2, cap2, wx2).concat(A2 ? [A2] : []);

  const anchorIdSet = ids.slice();
  const paid = d1.concat(d2).filter(function(s){
    return anchorIdSet.indexOf(s.id) < 0 && s.price > 0; });
  const res = {
    d1: orderStops(A.area, d1), d2: orderStops(seed2, d2), a2: A2,
    seed2: seed2,
    paidSum: paid.reduce(function(t,s){ return t + s.price; },0),
    paidNames: paid.map(function(s){ return s.n; })
  };
  SP_CACHE[key] = res;
  return res;
}

/* 排序：同区的排一起，区之间最近邻串，夜里的排最后 */
function nightRank(s){ return (s.tags && s.tags.indexOf('night')>=0) ? 2 : (s.cat==='市' ? 1 : 0); }
function orderStops(seedArea, list){
  const groups = {}, areas = [];
  list.forEach(function(s){
    if (!groups[s.area]){ groups[s.area] = []; areas.push(s.area); }
    groups[s.area].push(s);
  });
  const chain = []; let cur = seedArea, left = areas.slice();
  while (left.length){
    let bi = 0, bd = 1e9;
    left.forEach(function(a,i){ const d = hopMin(cur,a); if (d < bd){ bd = d; bi = i; } });
    cur = left[bi]; chain.push(cur); left.splice(bi,1);
  }
  chain.sort(function(a,b){
    function mx(g){ return g.reduce(function(t,s){ return Math.max(t,nightRank(s)); },0); }
    return mx(groups[a]) - mx(groups[b]);
  });
  const out = [];
  chain.forEach(function(a){
    groups[a].sort(function(x,y){ return nightRank(x)-nightRank(y) || mins(x.to)-mins(y.to); });
    groups[a].forEach(function(s){ out.push(s); });
  });
  return out;
}

/* 把一串站点排成带时刻的行：走过去、等开门、该吃饭了、逛 */
function layDay(startClock, seedArea, stops, anchorId, meal, mealAt){
  const rows = []; let t = mins(startClock), area = seedArea, ate = false;
  function pushMeal(){
    rows.push({ k:'meal', n:meal.cap, m:meal.m, why:meal.why, opts:meal.opts, hint:meal.hint });
    t += meal.m; ate = true;
  }
  stops.forEach(function(s){
    const hop = hopMin(area, s.area);
    if (hop >= 8){ rows.push({ k:'move', n:'前往 ' + areaName(s.area), m:hop, why:'' }); t += hop; }
    else t += hop;
    area = s.area;
    const open = mins(s.from);
    if (t < open){
      rows.push({ k:'gap', m:open-t, n:'等 ' + s.n + ' 开门',
        why: s.n + ' ' + s.from + ' 才开门——这段空档是这个作息换来的。' });
      t = open;
    }
    if (!ate && t >= mins(mealAt)) pushMeal();
    rows.push({ k: s.id===anchorId ? 'anchor' : 'stop', n:s.n, m:s.dur, why:s.why, hint:s.tip });
    t += s.dur;
  });
  if (!ate) pushMeal();
  return rows;
}

function aRows(sel){
  const A  = anchorSight(aAnchors[0]);
  const R  = rhythmOf();
  const W  = wxNow();
  const P  = sightPick(aAnchors, sel.sights, R.id, W[0], W[1]);
  const F  = byId(HK.foods, sel.food) || HK.foods[0];
  const tr = tierOf(A_COMPONENTS,'transport',sel.transport);
  const st = tierOf(A_COMPONENTS,'stay',sel.stay);
  const legT = tr.minutes/2, legS = st.minutes/2;
  const dayTrip = sel.stay === 'none';
  const aid  = aAnchors[0]==='custom' ? 'custom' : A.id;
  const aid2 = P.a2 ? P.a2.id : null;

  let d1 = [];
  if (legT>0) d1.push({k:'move', n:'口岸接驳 · 抵港', m:legT,
    why:'比高铁直达多出来的那一段，省下的钱就在这里。'});
  d1 = d1.concat(layDay(addMin(R.start,legT), A.area, P.d1, aid, F.d1, R.m1));
  if (dayTrip){
    if (legT>0) d1.push({k:'move', n:'口岸接驳 · 返程', m:legT, why:'当天来回，回程这一段也得算进去。'});
    return { d1:d1, d2:null, dayTrip:true,
      d1t: dayTheme(P.d1), d2t:'' };
  }
  if (legS>0) d1.push({k:'move', n:'回 ' + areaName(st.area||'tst'), m:legS,
    why: st.name + '比住市区多出来的通勤。'});
  let d2 = [];
  if (legS>0) d2.push({k:'move', n:'从酒店出门', m:legS, why:'同样一段，早上再走一次。'});
  d2 = d2.concat(layDay(addMin(R.start,legS), st.area || P.seed2, P.d2, aid2, F.d2, R.m2));
  if (legT>0) d2.push({k:'move', n:'口岸接驳 · 返程', m:legT, why:'比高铁直达多出来的那一段。'});
  return { d1:d1, d2:d2, dayTrip:false, d1t:dayTheme(P.d1), d2t:dayTheme(P.d2) };
}

function dayTheme(stops){
  const seen = [];
  stops.forEach(function(s){ if (seen.indexOf(s.area)<0) seen.push(s.area); });
  return seen.map(areaName).join(' → ') + '，不走回头路';
}

/* ==================================================================
   通用：求解器（写死序列，不是优化器）
   ================================================================== */
const $ = function(id){ return document.getElementById(id); };
const esc = function(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); };
const yuan = function(n){ return '¥' + n.toLocaleString('en-US'); };
const REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function tierOf(comps,key,id){
  const ts = comps[key].tiers;
  for (let i=0;i<ts.length;i++){ if (ts[i].id===id) return ts[i]; }
  return ts[0];
}
function tierIdx(comps,key,id){
  const ts = comps[key].tiers;
  for (let i=0;i<ts.length;i++){ if (ts[i].id===id) return i; }
  return 0;
}
function sumOf(comps,sel){
  return Object.keys(sel).reduce(function(s,k){ return s + tierOf(comps,k,sel[k]).price; },0);
}
/* 从最高档开始，按序列依次降一档，直到装得下或序列耗尽 */
function withPin(top,pin){
  const sel = Object.assign({},top);
  if (pin) Object.keys(pin).forEach(function(k){ if (pin[k]) sel[k] = pin[k]; });
  return sel;
}
function solve(comps,top,seq,budget,pin){
  const sel = withPin(top,pin), steps = [];
  let total = sumOf(comps,sel);
  for (let i=0;i<seq.length && total>budget;i++){
    const s = seq[i];
    if (pin && pin[s.key]) continue;
    const from = tierOf(comps,s.key,sel[s.key]);
    const to   = tierOf(comps,s.key,s.to);
    sel[s.key] = s.to;
    total = total - from.price + to.price;
    steps.push({ key:s.key, from:from, to:to, saved:from.price-to.price, cost:s.cost });
  }
  return { sel:sel, steps:steps, total:total, exhausted:(total>budget) };
}
function floorOf(comps,top,seq,pin){
  const sel = withPin(top,pin);
  seq.forEach(function(s){ if (!(pin && pin[s.key])) sel[s.key] = s.to; });
  return sumOf(comps,sel);
}
function addMin(hhmm,m){
  const p = hhmm.split(':');
  let t = (parseInt(p[0],10)*60 + parseInt(p[1],10) + m) % 1440;
  return String(Math.floor(t/60)).padStart(2,'0') + ':' + String(t%60).padStart(2,'0');
}

function cardsHTML(comps,sel,prev,lockKey,order,lockLabel){
  return '<div class="cards ' + (order.length>2?'c4':'c2') + '">' + order.map(function(key){
    const t = tierOf(comps,key,sel[key]);
    const i = tierIdx(comps,key,sel[key]);
    const n = comps[key].tiers.length;
    const changed = prev && prev[key] !== sel[key] && !REDUCED;
    const locked = key === lockKey;
    return '<div class="card' + (changed?' flash':'') + (locked?' locked':'') + '">' +
      '<div class="card-top"><span class="card-label">' + comps[key].label + '</span>' +
      (locked ? '<span class="card-lock">' + (lockLabel||'你定的') + '</span>'
              : '<span class="card-tier">' + (i+1) + '/' + n + ' 档</span>') + '</div>' +
      '<div class="card-name">' + esc(t.name) + '</div>' +
      '<div class="card-note">' + (t.note ? esc(t.note) : '—') + '</div>' +
      '<div class="card-price num' + (t.price===0?' zero':'') + '">' + yuan(t.price) + '</div>' +
      '<div class="card-time' + (t.minutes>0?'':' none') + '">' +
        (t.minutes>0 ? '+' + t.minutes + ' 分钟 / 两天' : (locked?'最后才动':'不加时间')) + '</div>' +
    '</div>';
  }).join('') + '</div>';
}

      (gap>=0?'+':'−') + yuan(Math.abs(gap)) + '</div></div>' +
    '<div class="tcell"><div class="k">相对全高档省下</div><div class="v num">' + yuan(topTotal-total) + '</div></div>' +
  '</div>';
}

/* 取舍说明——每一条都必须说出代价 */
function tradeHTML(steps,comps,expanded){
  let h = '<div class="trade"><div class="sec-h">取舍说明</div><ul class="trade-list">';
  if (!steps.length){
    h += '<li><span class="trade-txt trade-empty">没有降级。这笔预算装得下现在这套。</span></li>';
  } else {
    const LIMIT = 3;
    const show = expanded ? steps : steps.slice(0,LIMIT);
    show.forEach(function(s,i){
      const what = s.to.id==='none' && s.key==='stay'
        ? '取消住宿，改当天来回'
        : comps[s.key].label + '从' + s.from.name + '换成' + s.to.name;
      h += '<li><span class="trade-idx">' + String(i+1).padStart(2,'0') + '</span>' +
           '<span class="trade-txt">为了省 <span class="save">' + yuan(s.saved) + '</span>，' +
           esc(what) + '，代价是<span class="cost">' + esc(s.cost) + '</span>。</span></li>';
    });
  }
  h += '</ul>';
  const rest = steps.length - 3;
  if (rest > 0){
    h += '<div class="more"><button type="button" id="foldBtn">' +
         (expanded ? '收起后 ' + rest + ' 项' : '…还调整了 ' + rest + ' 项') + '</button></div>';
  }
  return h + '</div>';
}

/* 行程条：站点时长固定，只有通勤增量随降级变长——富余被吃掉这件事要肉眼可见 */
function barHTML(rows,cap){
  let used = 0;
  const segs = rows.map(function(r){
    used += r.m;
    const cls = r.k==='move' ? 'seg-com' : (r.k==='gap' ? 'seg-slk'
      : (r.k==='meal' ? 'seg-meal' : (r.k==='anchor' ? 'seg-act seg-anchor' : 'seg-act')));
    return { cls:cls, m:r.m };
  });
  const over = Math.max(0, used - cap);
  const slack = Math.max(0, cap - used);
  const denom = Math.max(cap, used);
  let h = '<div class="bar">';
  segs.forEach(function(s){
    h += '<div class="seg ' + s.cls + '" style="flex:0 0 ' + (s.m/denom*100) + '%"><span class="sm">' + s.m + '</span></div>';
  });
  if (over > 0) h += '<div class="seg seg-over" style="flex:0 0 ' + (over/denom*100) + '%"><span class="sm">+' + over + '</span></div>';
  if (slack > 0) h += '<div class="seg seg-slk" style="flex:1 1 ' + (slack/denom*100) + '%"><span class="sm">' + slack + '</span></div>';
  return h + '</div>';
}

function stopsHTML(rows,startClock){
  let t = startClock;
  return '<ul class="stops">' + rows.map(function(r){
    const at = t; t = addMin(t, r.m);
    const cls = r.k==='move' ? 'is-move' : (r.k==='gap' ? 'is-gap'
      : (r.k==='meal' ? 'is-meal' : (r.k==='anchor' ? 'is-anchor' : '')));
    let nm = '<span class="snm">' + esc(r.n) + '<span class="dur">' + r.m + ' 分</span>' +
             (r.k==='anchor' ? '<span class="pin">锚点</span>' : '') + '</span>';
    let extra = '';
    if (r.opts && r.opts.length){
      extra += '<div class="opts2">' + r.opts.map(function(o){
        return '<span class="o">' + esc(o[0]) + ' <b>' + esc(o[1]) + '</b></span>';
      }).join('') + '<span class="o" style="border-style:dashed">二选一</span></div>';
    }
    if (r.hint) extra += '<div class="hint">' + esc(r.hint) + '</div>';
    return '<li class="stop ' + cls + '"><span class="clock num">' + at + '</span>' +
      '<span class="rail"></span><span class="sbody">' + nm +
      (r.why ? '<div class="swhy">' + esc(r.why) + '</div>' : '') + extra + '</span></li>';
  }).join('') + '</ul>';
}

                         custom:'自己填一个', nope:'我们替你定' };

/* 「逛多少」这一档的价格＝这一档下实际排进行程的付费景点门票和。
   选哪些景点只看锚点/作息/配额，不看预算，所以能先算出来再交给求解器。 */
function syncSightPrices(){
  const rid = rhythmOf().id, W = wxNow();
  A_COMPONENTS.sights.tiers.forEach(function(t){
    const P = sightPick(aAnchors, t.id, rid, W[0], W[1]);
    t.price = P.paidSum;
    t.note  = P.paidSum ? '门票 ' + yuan(P.paidSum) + ' · ' + P.paidNames.join('、') : '不买门票';
  });
}
function aAllow(){
  return { stay: aBand.stay ? bandIds('stay',aBand.stay) : null,
           food: aBand.food ? bandIds('food',aBand.food) : null };
}
/* 起点＝所选档位里最贵的那个；序列＝只在档位内降 */
function aCtx(anchorId){
  const al = aAllow(), top = Object.assign({},A_TOP,{anchor:anchorId});
  ['stay','food'].forEach(function(k){ if (al[k] && al[k].length) top[k] = al[k][0]; });
  return { top:top, seq:buildSeq(['food','stay','sights','transport'],al), allow:al };
}
/* 约束强度：越是"必须围着它排"的，越该先定——这就是锚点的本义 */
function constraintOf(s){
  let c = 0;
  if (s.book) c += 3;                              /* 要预约 */
  if (/只有周三/.test(s.tip||'')) c += 5;           /* 一周只有一天 */
  if (s.wind) c += 2;                              /* 大风会停 */
  if (/闭馆|休息/.test(s.tip||'')) c += 1;          /* 有闭馆日 */
  return c;
}
/* 锚点排序：选了偏好走「不可替代性」，没想法走「人气」。
   两种情况都叠加：约束强度（越受限越该先定）、时间占用（越吃时间越该先定）、天气。 */
function anchorScore(s,themes,wx){
  let sc;
  if (!themes.length){
    sc = s.pop*3 + s.uniq;
  } else {
    const hit = s.themes.filter(function(t){ return themes.indexOf(t)>=0; }).length;
    if (!hit) return -1;
    sc = s.uniq*2.5 + hit*4;
  }
  return sc + constraintOf(s)*2 + Math.min(s.dur,300)/60*2.5 + wxScore(s,wx)*0.15;
}
function anchorCands(themes,limit){
  const wx = wxNow()[0];
  const picked = anchorList();
  return HK.sights.map(function(s){
      let sc = anchorScore(s,themes,wx);
      if (sc >= 0 && picked.length){
        /* 已经定了一天的锚点，另一天该去另一边——同侧的往后压 */
        const sameSide = picked.some(function(p){ return sideOf(p.area) === sideOf(s.area); });
        sc += sameSide ? -14 : 8;
      }
      return { s:s, sc:sc };
    })
    .filter(function(x){ return x.sc >= 0 && aAnchors.indexOf(x.s.id) < 0; })
    .sort(function(x,y){ return y.sc - x.sc; })
    .slice(0, limit || 8).map(function(x){ return x.s; });
}
function anchorSearch(q){
  const k = (q||'').trim().toLowerCase();
  if (!k) return [];
  return HK.sights.filter(function(s){
    return s.n.toLowerCase().indexOf(k) >= 0 || (s.why||'').toLowerCase().indexOf(k) >= 0;
  }).slice(0,6);
}
/* 卡片上的徽章：说清这个锚点会对行程造成什么 */
function anchorTags(s){
  const t = [];
  if (s.dur >= 240) t.push(['whole','吃掉整天']);
  if (s.book || /只有周三/.test(s.tip||'')) t.push(['book','得提前定']);
  if (s.uniq >= 9) t.push(['uniq','别处没有']);
  else if (s.pop >= 8) t.push(['pop','人气']);
  return t;
}
function anchorCardHTML(s){
  const i = aAnchors.indexOf(s.id);
  return '<button class="pcard acard' + (i>=0?' picked':'') + '" type="button" data-anchor="' + s.id +
    '" aria-pressed="' + (i>=0) + '">' +

    '<span class="atags">' + anchorTags(s).map(function(t){
      return '<span class="atag t-' + t[0] + '">' + t[1] + '</span>'; }).join('') + '</span>' +
    '<span class="pn">' + esc(s.n) + '</span>' +
    '<span class="pnote">' + esc((s.why||'').split('。')[0]) + '。</span>' +
    '<span class="pp num' + (s.price===0?' zero':'') + '">' +
      (s.price ? yuan(s.price) : '免费') + '</span>' +

}
function candsHTML(){

      '<button class="unpin" type="button" id="useCustom">就按这个名字排</button>' +
      '<span class="nh-w">费用和时长算不进总价。</span></div>';
  }
  return '<div class="pick">' + anchorCands(aThemes).map(anchorCardHTML).join('') + '</div>';
}

                    .reduce(function(s,r){ return s+r.m; },0);
  let h = '<div class="pad"><div class="sec-h">每日路线</div>' + wxHTML(sel) + '<div class="route">';
  h += dayBlock('DAY 1', rows.d1t, rows.d1, cap, R.start);
  if (rows.d2){
    h += dayBlock('DAY 2', rows.d2t, rows.d2, cap, R.start);
  } else {
    h += '<div class="day-block"><div class="day-cap"><span class="d">DAY 2</span>' +
      '<span class="theme">没有第二天了</span></div><div class="day-dead"><div class="k">取 消</div>' +
      '<div class="w">取消住宿换来的不是通勤时间，是一整天。</div></div></div>';
  }
  h += '</div>' + LEGEND;
  h += '<div style="font-size:12.5px;color:var(--dim);margin-top:11px;padding-top:10px;border-top:1px dashed var(--line)">' +
    (rows.dayTrip
      ? '当天来回。Day 1 两头都要算口岸接驳，这条线从 ' + R.start + ' 走到晚上。'
      : (totalCom===0
        ? '通勤增量 <b class="num" style="color:var(--accent)">0</b> 分钟。'
        : '两天多出 <b class="num" style="color:var(--warn)">' + totalCom + '</b> 分钟通勤，全部从富余里扣。')) + '</div>';
  return h + '</div>';
}

function bRouteHTML(sel){
  const R = B_ROUTES[bMood];
  const rows = bApplyHours(bRows(sel,bMood));
  const used = rows.reduce(function(s,r){ return s+r.m; },0);
  let h = '<div class="pad"><div class="sec-h">这三小时怎么走</div><div class="route">';
  h += dayBlock('15:20 起', R.t, rows, B_CAP, B_NOW);
  h += '</div>' + LEGEND;
  h += '<div style="font-size:12.5px;color:var(--dim);margin-top:11px;padding-top:10px;border-top:1px dashed var(--line)">' +
    (used > B_CAP
      ? '这条线 <b class="num" style="color:var(--warn)">' + used + '</b> 分钟，比你有的三小时多 ' + (used-B_CAP) +
        ' 分。'
      : '这条线 <b class="num" style="color:var(--accent)">' + used + '</b> 分钟，' + B_NOW + ' 出发，' +
        addMin(B_NOW,used) + ' 结束。') + '</div>';
  return h + '</div>';
}

function wire(){
  const fold = $('foldBtn');
  if (fold) fold.onclick = function(){ expanded = !expanded; update(); };
  const up = $('upBtn') || $('freeBtn');
  if (up) up.onclick = function(){
    const el = scene==='plan' ? $('budgetA') : $('budgetB');
    const step = parseInt(el.step,10), min = parseInt(el.min,10), max = parseInt(el.max,10);
    let v = min + Math.ceil((parseInt(up.dataset.need,10)-min)/step)*step;
    if (v > max) v = max;
    el.value = v;
    el.dispatchEvent(new Event('input',{bubbles:true}));
  };
  Array.prototype.forEach.call(document.querySelectorAll('.status [data-anchor]'), function(b){
    b.onclick = function(){ aAnchors[0] = b.dataset.anchor; aPrev = null; aFirstRun = true; renderSteps(); };
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-pick]'), function(b){
    b.onclick = function(){
      const k = b.dataset.pick;
      aPin[k] = (aPin[k] === b.dataset.id) ? null : b.dataset.id;
      expanded = false; update();
    };
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-unpin]'), function(b){
    b.onclick = function(){ aPin[b.dataset.unpin] = null; expanded = false; update(); };
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-relax]'), function(b){
    b.onclick = function(){ relaxBands(); };
  });
  const wxb = $('wxBtn');
  if (wxb) wxb.onclick = function(){ aIgnoreWx = !aIgnoreWx; aPrev = null; update(); };
}

function update(){
  if (scene === 'plan'){
    /* 没问完就不铺内容——方案是问出来的 */
    if (aStep < 4 || aAnchors.length < A_DAYS){
      $('planOut').innerHTML = ''; $('planOut').className = ''; return; }
    const budget = aBudget;
    tierOf(A_COMPONENTS,'anchor','custom').name = customName();
    syncAnchorTier();
    syncSightPrices();
    const c = aCtx('__picked');
    const r = solve(A_COMPONENTS, c.top, c.seq, budget, aPin);
    const stayT = '住宿' + (aBand.stay ? ' · ' + bandOf('stay',aBand.stay).n : '');
    $('planOut').className = aFirstRun ? 'first-run' : '';
    $('planOut').innerHTML =
      aStatusHTML(budget,r,aAnchors[0]) +
      cardsHTML(A_COMPONENTS, r.sel, aPrev, 'anchor', A_ORDER, '你定的') +
      '<div class="divider"></div>' +
      pickHTML(A_COMPONENTS,'stay',r.sel,aPin.stay,stayT,c.allow.stay) +
      totalsHTML(r.total, budget, sumOf(A_COMPONENTS,withPin(c.top,aPin))) +
      '<div class="divider"></div>' + aRouteHTML(r.sel);
    aFirstRun = false;
    lastSel = r.sel;
    aPrev = Object.assign({}, r.sel);
  } else {
    const budget = parseInt($('budgetB').value,10);
    const r = solve(B_COMPONENTS, B_TOP, B_SEQ, budget);
    $('planOut').innerHTML =
      bStatusHTML(budget,r) +
      cardsHTML(B_COMPONENTS, r.sel, bPrev, null, B_ORDER) +
      totalsHTML(r.total, budget, sumOf(B_COMPONENTS,B_TOP)) +
      '<div class="divider"></div>' + tradeHTML(r.steps, B_COMPONENTS, expanded) +
      '<div class="divider"></div>' + bRouteHTML(r.sel);
    bPrev = Object.assign({}, r.sel);
  }
  wire();
}

function setAnchor(a){
  if (aAnchors.indexOf(a) >= 0 || aAnchors.length >= A_DAYS) return;
  aAnchors.push(a);
  aSearch = '';
  aPrev = null; expanded = false; aFirstRun = true;
  if (aAnchors.length >= A_DAYS && aStep < 1) aStep = 1;
  renderSteps();
  const last = $('aSteps') && $('aSteps').lastElementChild;
  if (aAnchors.length >= A_DAYS && last && last.scrollIntoView) last.scrollIntoView({block:'nearest'});
}
function unsetAnchor(id){
  const i = aAnchors.indexOf(id);
  if (i < 0) return;
  aAnchors.splice(i,1);
  if (aAnchors.length < A_DAYS) aStep = 0;
  aPrev = null; aFirstRun = true;
  renderSteps();
}
function setTheme(id){
  aThemePicked = true;
  aSearch = '';
  if (id === '__none'){ aThemes = []; }
  else {
    const i = aThemes.indexOf(id);
    if (i >= 0) aThemes.splice(i,1); else aThemes.push(id);
  }
  /* 换了偏好，之前选的锚点如果不在新候选里就退回未选 */
  if (aAnchors.length){
    const ok = HK.sights.filter(function(s){ return anchorScore(s,aThemes,null) >= 0; })
      .map(function(s){ return s.id; });
    aAnchors = aAnchors.filter(function(id){ return id==='custom' || ok.indexOf(id)>=0; });
    if (aAnchors.length < A_DAYS) aStep = 0;
  }
  aPrev = null; aFirstRun = true;
  renderSteps();
}
function setFood(id){
  aPin.food = (id === '__auto') ? null : id;
  aBand.food = null;
  aPrev = null; expanded = false; aFirstRun = true;
  if (aStep < 4) aStep = 4;
  renderSteps();
}
function setRhythm(id){
  aRhythm = (aRhythm === id) ? null : id;
  aPrev = null; expanded = false; aFirstRun = true;
  if (aRhythm && aStep < 2) aStep = 2;
  renderSteps();
}
function setBand(key,id){
  aBand[key] = (aBand[key] === id) ? null : id;
  aPin[key] = null;               /* 换了档位，之前钉的那一家可能不在这档里 */
  aPrev = null; expanded = false; aFirstRun = true;
  if (aBand[key] && aStep < 3) aStep = 3;
  renderSteps();
}
function relaxBands(){
  aBand.stay = null; aBand.food = null; aPin.stay = null; aPin.food = null;
  aPrev = null; expanded = false; renderSteps();
}

/* 候选区单独接线：搜索时只换这一块，输入框不重建，焦点不丢 */
function wireCands(){
  Array.prototype.forEach.call(document.querySelectorAll('#anchorCands [data-anchor]'), function(b){
    b.onclick = function(){ setAnchor(b.dataset.anchor); };
  });
  const uc = $('useCustom');
  if (uc) uc.onclick = function(){ aCustom = aSearch.trim(); setAnchor('custom'); };
  Array.prototype.forEach.call(document.querySelectorAll('[data-unanchor]'), function(b){
    b.onclick = function(){ unsetAnchor(b.dataset.unanchor); };
  });
}

function renderSteps(){
  const box = $('aSteps');
  if (!box) return;
  box.innerHTML = stepsHTML();
  Array.prototype.forEach.call(box.querySelectorAll('[data-theme]'), function(b){
    b.onclick = function(){ setTheme(b.dataset.theme); };
  });
  wireCands();
  const sb = $('anchorSearch');
  if (sb) sb.oninput = function(){
    aSearch = sb.value;
    const c = $('anchorCands');
    if (c){ c.innerHTML = candsHTML(); wireCands(); }
  };
  Array.prototype.forEach.call(box.querySelectorAll('[data-rhythm]'), function(b){
    b.onclick = function(){ setRhythm(b.dataset.rhythm); };
  });
  Array.prototype.forEach.call(box.querySelectorAll('[data-band]'), function(b){
    b.onclick = function(){ setBand(b.dataset.band, b.dataset.id); };
  });
  Array.prototype.forEach.call(box.querySelectorAll('[data-food]'), function(b){
    b.onclick = function(){ setFood(b.dataset.food); };
  });
  const ci = $('anchorText');
  if (ci) ci.oninput = function(){ aCustom = ci.value; update(); };
  const el = $('budgetA'), out = $('budgetOutA');
  if (el && out){
    el.value = aBudget;
    out.textContent = yuan(aBudget);
    el.addEventListener('input', function(){
      aBudget = parseInt(el.value,10);
      out.textContent = yuan(aBudget);
      const vs = $('budgetVs'), dd = aBudget - A_ASKED;
      if (vs){
        vs.textContent = dd===0 ? '你说的数'
          : (dd>0 ? '比你说的多 ' : '比你说的少 ') + yuan(Math.abs(dd));
        vs.className = 'vs' + (dd===0 ? ' same' : '');
      }
      expanded = false; update();
    });
  }
  update();
}
function setMood(m){
  bMood = m;
  Array.prototype.forEach.call(document.querySelectorAll('#bOpts .opt'), function(b){
    b.setAttribute('aria-pressed', String(b.dataset.mood===m));
  });
  update();
}

/* 一步一问：答完这一步，下一步才出现。内容是问出来的，不是一次性倒出来的。 */
function stepHTML(i,q,bodyHTML,answered,answerLine){
  const cls = 'step' + (answered ? ' done' : '') + (i===aStep ? ' reveal' : '');
  return '<div class="' + cls + '">' +
    '<div class="step-h"><span class="step-n">' + (i+1) + ' / 5</span>' +
    '<p class="step-q">' + q + '</p></div>' + bodyHTML +
    (answered && answerLine ? '<p class="step-a">' + answerLine + '</p>' : '') +
  '</div>';
}

function stepsHTML(){
  let h = '';

  /* 第一步：先问偏好，再据此推锚点。两段在同一步里，答完才进第二步 */
  const th = HK.themes.map(function(t){
    return '<button class="opt" type="button" data-theme="' + t.id +
      '" aria-pressed="' + (aThemes.indexOf(t.id)>=0) + '">' + t.n +
      '<span class="op-sub">' + t.sub + '</span></button>';
  }).join('') +
    '<button class="opt" type="button" data-theme="__none" aria-pressed="' +
    (aThemePicked && !aThemes.length) + '">没想法<span class="op-sub">给我推人气的</span></button>';

  let seg2 = '';
  if (aThemePicked){
    const left = A_DAYS - aAnchors.length;
    const chosen = aAnchors.length
      ? '<div class="chosen">已定：' + anchorList().map(function(s,i){
          return '<button class="chip" type="button" data-unanchor="' + s.id + '">' +
            '<b>DAY ' + (i+1) + '</b> ' + esc(s.n) + ' ✕</button>'; }).join('') + '</div>'
      : '';
    seg2 = '<div class="subq">' + chosen +
      (left > 0
        ? (aAnchors.length
            ? '还差 <b>' + left + ' 个</b>。第二天换一边走，所以下面优先推另一侧的：'
            : (aThemes.length
               ? '<b>' + A_DAYS + ' 天挑 ' + A_DAYS + ' 个</b>，一天一个主心骨。越靠前的越"必须围着它排"：'
               : '那就按人气推。<b>' + A_DAYS + ' 天挑 ' + A_DAYS + ' 个：</b>'))
        : '<b>两天的锚点都定了。</b>其余全部按顺路排在它们周围。') +
      '</div>' +
      (left > 0 ? '<div id="anchorCands">' + candsHTML() + '</div>' +
        '<input class="custom-in" id="anchorSearch" type="search" value="' +
        esc(aSearch).replace(/"/g,'&quot;') +
        '" placeholder="都不想去？搜一个：庙街、大澳、跑马地…">' : '');
  }
  h += stepHTML(0, A_DAYS + ' 天。<b>你旅行时更想看什么？</b>',
    '<div class="opts" id="aThemes">' + th + '</div>' + seg2,
    aStep > 0, aAnchors.length >= A_DAYS
      ? '锚点：' + anchorList().map(function(s,i){
          return 'DAY' + (i+1) + ' <b>' + esc(s.n) + '</b>'; }).join('，') + '。' : '');
  if (aStep < 1) return h;

  /* 第二步：作息。一天从几点到几点，是排路线的前提，所以排在钱之前 */
  const rh = A_RHYTHM.map(function(R){
    return '<button class="bandbtn" type="button" data-rhythm="' + R.id +
      '" aria-pressed="' + (aRhythm===R.id) + '">' + R.n +
      '<span class="bs">' + R.sub + '</span></button>';
  }).join('');
  h += stepHTML(1, '一天从几点算起？<b>早出早归，还是晚出晚归？</b>',
    '<div class="band">' + rh + '</div>',
    aStep > 1, aRhythm ? rhythmOf().a : '');
  if (aStep < 2) return h;

  /* 第三步：住宿。13 家，所以先定价位再挑具体哪一家 */
  if (aStep >= 2){
    const bands = A_BANDS.stay.map(function(b){
      return '<button class="bandbtn" type="button" data-band="stay" data-id="' + b.id +
        '" aria-pressed="' + (aBand.stay===b.id) + '">' + b.n +
        '<span class="bs">' + b.sub + ' · ' + bandCount('stay',b.id) + ' 家</span></button>';
    }).join('');
    const pk = aBand.stay ? bandOf('stay',aBand.stay) : null;
    h += stepHTML(2, A_BAND_Q.stay, '<div class="band">' + bands + '</div>',
      aStep > 2, pk ? '在' + pk.n + '这一档里挑，' + bandCount('stay',pk.id) +
        ' 家备选，下面可以左右滑。' : '');
  }
  if (aStep < 3) return h;

  /* 第四步：吃饭。只有 6 档，不绕档位，直接摆价格让人比 */
  const fsel = aPin.food ? byId(HK.foods,aPin.food) : null;
  h += stepHTML(3, '两天四顿。<b>吃这一块打算怎么花？</b>',
    foodPickHTML(lastSel || A_TOP),
    aStep > 3, fsel
      ? '选了' + esc(fsel.n) + '，两天四顿 ' + yuan(fsel.price) + '，每顿约 ' +
        yuan(Math.round(fsel.price/4)) + '。'
      : '没挑具体的——预算不够时这一项会先降。');
  if (aStep < 4) return h;

  /* 第五步：预算不是问句——它已经在第一句话里给过了。这里是拨给你看代价 */
  const d = aBudget - A_ASKED;
  h += stepHTML(4, '预算你一开始就说了 <b>' + yuan(A_ASKED) + ' 以内</b>。' +
    '<b>上下拨几百试试——多给一点能换回什么，少给一点先掉哪个。</b>',
    '<div class="ctl"><span class="ctl-label">预算 / 单人</span>' +
    '<span class="readout"><span class="cur num" id="budgetOutA">' + yuan(aBudget) + '</span>' +
    '<span class="vs' + (d===0?' same':'') + '" id="budgetVs">' +
      (d===0 ? '你说的数' : (d>0?'比你说的多 ':'比你说的少 ') + yuan(Math.abs(d))) + '</span></span>' +
    '<div class="slider-line"><input type="range" id="budgetA" min="1000" max="2000" step="50" value="' +
    aBudget + '" aria-label="预算，单位人民币">' +
    '<div class="scale"><span>¥1000</span><span class="said">↑ 你说的 ' + yuan(A_ASKED) +
    '</span><span>¥2000</span></div></div></div>', false, '');
  return h;
}

function shellA(){
  return '<div class="pad" style="padding-bottom:0"><div class="ask">' +
    '下周六去香港玩两天，一个人 <b>1500 以内</b></div></div>' +
    '<div id="aSteps"></div><div id="planOut"></div>';
}
function shellB(){
  const opts = Object.keys(B_ROUTES).map(function(k){
    return '<button class="opt" type="button" data-mood="' + k + '" aria-pressed="' + (k===bMood) + '">' +
      B_ROUTES[k].q + '<span class="op-sub">' + B_ROUTES[k].qs + '</span></button>';
  }).join('');
  return '<div class="ask">我现在在香港中环，下午有<b>三个小时</b></div>' +
    '<p class="narrow-q">三小时，够走三四个地方。<b>你现在想走走，还是想坐着？</b></p>' +
    '<p class="narrow-why">此刻 15:20 · 周六</p>' +
    '<div class="opts" id="bOpts">' + opts + '</div>' +
    '<div class="stick"><div class="ctl"><span class="ctl-label">兜里还剩</span>' +
    '<span class="readout"><span class="cur num" id="budgetOutB">¥120</span></span>' +
    '<div class="slider-line"><input type="range" id="budgetB" min="20" max="220" step="10" value="120" ' +
    'aria-label="剩余现金，单位人民币"><div class="scale"><span>¥20</span><span>¥220</span></div></div></div></div>' +
    '<div id="planOut"></div>';
}

function show(s){
  scene = s; expanded = false; aPrev = null; bPrev = null;
  Array.prototype.forEach.call(document.querySelectorAll('#tabs button'), function(b){
    b.setAttribute('aria-current', String(b.dataset.s===s));
  });
  const isPlan = s === 'plan';
  $('nowBody').innerHTML = isPlan ? WALL_PLAN : WALL_NOW;
  $('nowT').textContent = '实测回答';
  $('nowBody').scrollTop = 0;
  $('newBody').innerHTML = isPlan ? shellA() : shellB();
  $('newBody').scrollTop = 0;

  if (isPlan){
    /* 每次进来从第一问重新走一遍 */
    aAnchors = []; aStep = 0; aFirstRun = true; aCustom = '';
    aRhythm = null; aBudget = A_ASKED; aIgnoreWx = false;
    aThemes = []; aSearch = ''; aThemePicked = false;
    aBand = { stay:null, food:null };
    aPin  = { stay:null, food:null };
    renderSteps();
    return;
  }

  const el = $('budgetB'), out = $('budgetOutB');
  el.addEventListener('input', function(){
    out.textContent = yuan(parseInt(el.value,10));
    expanded = false;
    update();
  });
  out.textContent = yuan(parseInt(el.value,10));
  Array.prototype.forEach.call(document.querySelectorAll('#bOpts .opt'), function(b){
    b.onclick = function(){ setMood(b.dataset.mood); };
  });
  update();
}

Array.prototype.forEach.call(document.querySelectorAll('#tabs button'), function(b){
  b.onclick = function(){ show(b.dataset.s); };
});
initA();
show('plan');
</script>
</body>
